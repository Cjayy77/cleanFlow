<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page introuvable, Zebramoon</title>
<link rel="icon" href="/assets/moon-nav.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font-body); color:var(--ink); background:var(--ivory);
    min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:32px; line-height:1.6; }
  .card{ max-width:520px; text-align:center; }
  .brand{ display:inline-flex; align-items:center; gap:10px; margin-bottom:40px; }
  .brand img{ height:76px; width:auto; }
  .code{ font-family:var(--font-secondary); font-size:96px; font-weight:600; line-height:1; letter-spacing:-0.02em; color:var(--pink); }
  h1{ font-family:var(--font-secondary); font-size:27px; font-weight:600; letter-spacing:-0.005em; margin:18px 0 10px; }
  p{ color:var(--muted); font-size:16px; margin-bottom:32px; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ text-decoration:none; font-family:var(--font-nav); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.07em; padding:13px 24px; border-radius:var(--radius); transition:transform .2s var(--ease), background .18s ease-out; display:inline-block; }
  .btn.primary{ background:var(--pink); color:var(--on-light); }
  .btn.primary:hover{ transform:translateY(-1px); background:var(--pink-deep); }
  .btn.primary:active{ transform:translateY(0) scale(.97); }
  .btn.ghost{ background:var(--paper); color:var(--ink); border:1px solid var(--line); }
  .btn.ghost:hover{ transform:translateY(-1px); border-color:var(--pink); }
  .btn.ghost:active{ transform:translateY(0) scale(.97); }
  .links{ margin-top:34px; font-size:13px; color:var(--muted); }
  .links a{ color:var(--ink); text-decoration:none; font-weight:600; }
  .links a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/logo-square-trim.png" alt="Zebramoon"></div>
    <div class="code">404</div>
    <h1>Cette page a fait le ménage</h1>
    <p>La page que vous cherchez n’existe pas ou a été déplacée. Vérifiez l’adresse, ou revenez à l’accueil.</p>
    <div class="actions">
      <a class="btn primary" href="/">Retour à l’accueil</a>
      <a class="btn ghost" href="/devis/">Obtenir un devis gratuit</a>
    </div>
    <div class="links">
      Espaces : <a href="/app/">Client</a> · <a href="/prestataire/">Prestataire</a> · <a href="/livreur/">Livreur</a> · <a href="/welcomer/">Welcomer</a>
    </div>
  </div>
</body>
</html>
