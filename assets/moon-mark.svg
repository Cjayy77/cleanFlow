<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <mask id="moonMask" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <circle cx="185" cy="210" r="150" fill="#fff"/>
      <circle cx="262" cy="163" r="139" fill="#000"/>
    </mask>
    <filter id="moonShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="8" stdDeviation="7" flood-color="#3d0f3a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#moonShadow)">
    <g mask="url(#moonMask)">
      <circle cx="185" cy="210" r="150" fill="none" stroke="#20103c" stroke-width="24"/>
      <circle cx="185" cy="210" r="118" fill="none" stroke="#3a1152" stroke-width="24"/>
      <circle cx="185" cy="210" r="86"  fill="none" stroke="#7d1470" stroke-width="24"/>
      <circle cx="185" cy="210" r="54"  fill="none" stroke="#c21f7c" stroke-width="24"/>
      <circle cx="185" cy="210" r="22"  fill="none" stroke="#fb4193" stroke-width="28"/>
    </g>
  </g>
</svg>
