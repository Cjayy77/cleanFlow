<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" aria-hidden="true" focusable="false">
  <!-- Hero moon: a zebra-striped crescent, same crescent-mask technique as
       moon-mark.svg (big circle minus an offset circle) but with irregular
       concentric bands standing in for fur/stripe texture, plus a soft glow. -->
  <defs>
    <radialGradient id="moonGlow" cx="38%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#F2EDE1" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F2EDE1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F2EDE1" stop-opacity="0"/>
    </radialGradient>
    <mask id="moonCrescent" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="560">
      <circle cx="260" cy="300" r="210" fill="#fff"/>
      <circle cx="368" cy="228" r="195" fill="#000"/>
    </mask>
  </defs>
  <circle cx="260" cy="300" r="270" fill="url(#moonGlow)"/>
  <circle cx="260" cy="300" r="210" fill="#0A0A09"/>
  <g mask="url(#moonCrescent)">
    <circle cx="260" cy="300" r="205" fill="none" stroke="#F2EDE1" stroke-width="15" opacity="0.92"/>
    <circle cx="260" cy="300" r="179" fill="none" stroke="#F2EDE1" stroke-width="8" opacity="0.46"/>
    <circle cx="260" cy="300" r="153" fill="none" stroke="#F2EDE1" stroke-width="21" opacity="0.88"/>
    <circle cx="260" cy="300" r="123" fill="none" stroke="#F2EDE1" stroke-width="6" opacity="0.36"/>
    <circle cx="260" cy="300" r="99" fill="none" stroke="#F2EDE1" stroke-width="18" opacity="0.82"/>
    <circle cx="260" cy="300" r="71" fill="none" stroke="#F2EDE1" stroke-width="10" opacity="0.52"/>
    <circle cx="260" cy="300" r="47" fill="none" stroke="#F2EDE1" stroke-width="23" opacity="0.92"/>
    <circle cx="260" cy="300" r="18" fill="none" stroke="#F2EDE1" stroke-width="28" opacity="0.96"/>
  </g>
</svg>
