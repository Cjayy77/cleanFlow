<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanFlow — Livreur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--klein:#002FA7;--klein-deep:#001F73;--klein-tint:#EDF0FB;--gold:#D9A441;--ink:#10131A;--muted:#5A6472;--paper:#F5F6FA;--line:#DCE1EE;--white:#FFFFFF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;}
  .app-wrap{max-width:1140px;margin:0 auto;padding:28px 18px 60px 18px;}
  .top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:28px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;}
  .brand span{color:var(--klein);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px 18px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn.primary{background:var(--klein);color:var(--white);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:22px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--klein);margin-bottom:10px;}
  h1,h2{font-family:'Space Grotesk',sans-serif;}
  h1{font-size:32px;margin-bottom:8px;}p{color:var(--muted);line-height:1.6;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media(max-width:720px){.form-row{grid-template-columns:1fr;}}
  label{display:block;font-size:13px;margin-bottom:6px;font-weight:600;}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;background:var(--white);color:var(--ink);}
  .empty-state{padding:26px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;}
  .task-card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
  .task-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .task-title{font-size:15px;font-weight:700;}
  .task-meta{font-size:13px;color:var(--muted);margin-top:8px;}
  .status-pill{font-size:11px;font-weight:700;border-radius:999px;padding:8px 12px;display:inline-flex;align-items:center;}
  .status-pill.pending{background:#EDF2FE;color:#1D4ED8;}
  .status-pill.accepted{background:#EAF0FB;color:#1D4ED8;}
  .status-pill.submitted{background:var(--klein-tint);color:var(--klein);}
  .status-pill.verified{background:#E4F3EA;color:#166534;}
  .status-banner{padding:16px;border-radius:14px;background:#FEF3F2;color:#B91C1C;margin-bottom:18px;}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="top-row">
    <div>
      <div class="brand">Clean<span>Flow</span></div>
      <div class="eyebrow">Espace livreur</div>
    </div>
    <button class="btn ghost" id="signOutBtn">Se déconnecter</button>
  </div>

  <div class="card" id="authScreen">
    <div class="eyebrow">Connexion requise</div>
    <h1>Se connecter</h1>
    <p>Accédez à la page des opérations linge. Votre compte doit être créé par CleanFlow.</p>
    <div id="authError" class="status-banner hidden"></div>
    <form id="signInForm">
      <div class="form-row"><label for="signInEmail">Email</label><input id="signInEmail" type="email" required></div>
      <div class="form-row"><label for="signInPassword">Mot de passe</label><input id="signInPassword" type="password" required></div>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </div>

  <div id="appScreen" class="hidden">
    <div class="card">
      <div class="eyebrow">Bonjour</div>
      <h1 id="userNameLabel">Livreur</h1>
      <p>Voici les missions de collecte et livraison de linge disponibles pour votre compte.</p>
    </div>

    <div class="card">
      <div class="eyebrow">Missions linge</div>
      <h2>Réservations avec linge demandé</h2>
      <div id="taskList"></div>
    </div>
  </div>
</div>
<script type="module" src="./livreur.js"></script>
</body>
</html>
